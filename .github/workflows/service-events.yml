# The events service's own pipeline: it builds that service's image and runs
# that service's unit tests, and nothing else. Triggered by changes to the
# service itself or to the common/ foundation it is built on, so the three
# backend services no longer wait on each other to go green.
name: events service

on:
  push:
    branches:
      - "**"
    paths:
      - "services/events/**"
      - "common/**"
      - "tests/unit/test_events_api.py"
      - ".github/workflows/service-events.yml"
      - ".github/scripts/unit_test_summary.py"
  pull_request:
    paths:
      - "services/events/**"
      - "common/**"
      - "tests/unit/test_events_api.py"
      - ".github/workflows/service-events.yml"
      - ".github/scripts/unit_test_summary.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: events-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build image and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            common/requirements.txt
            services/events/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q common services/events

      # The build context is the repository root so the image can reach common/,
      # but the Dockerfile copies only what this service needs.
      - name: Build the service image
        run: docker build --file services/events/Dockerfile --tag event-registration-events:ci .

      - name: Run unit tests
        run: pytest tests/unit/test_events_api.py --junitxml=reports/events-tests.xml

      - name: Publish results summary
        if: always()
        run: python .github/scripts/unit_test_summary.py reports/events-tests.xml event-registration-events:ci >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-test-report
          path: reports/events-tests.xml
          if-no-files-found: warn
