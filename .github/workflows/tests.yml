name: Build and test

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q app web scripts

      - name: Build Docker image
        run: docker build --tag event-registration:ci .

      - name: Run unit tests
        run: pytest tests/unit --junitxml=reports/unit-tests.xml

      - name: Publish results summary
        if: always()
        run: python .github/scripts/unit_test_summary.py reports/unit-tests.xml event-registration:ci >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-tests.xml
          if-no-files-found: warn

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 20
    env:
      API_BASE_URL: http://127.0.0.1:8000
      WEB_BASE_URL: http://127.0.0.1:5000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate bootstrap administrator credentials
        run: |
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_password}"
          {
            echo "ADMIN_USERNAME=event-admin"
            echo "ADMIN_PASSWORD=${admin_password}"
          } >> "$GITHUB_ENV"

      - name: Start API and web services
        run: docker compose up --build -d --wait

      - name: Wait for the web interface
        run: >
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-delay 2 --retry-all-errors
          "${WEB_BASE_URL}/"

      - name: Run end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -m e2e -rs | tee e2e-output.txt
          if grep -Eq '[0-9]+ skipped' e2e-output.txt; then
            echo "::error::End-to-end tests were skipped instead of run."
            exit 1
          fi

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
