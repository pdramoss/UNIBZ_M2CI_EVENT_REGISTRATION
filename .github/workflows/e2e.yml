# The whole stack, end to end: five containers behind the one published port.
#
# This is the only pipeline that proves the separated services still compose
# into a working application, so it is never path filtered and it builds every
# image from scratch.
name: End-to-end tests

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      API_BASE_URL: http://127.0.0.1:9000
      GATEWAY_BASE_URL: http://127.0.0.1:9000
      WEB_BASE_URL: http://127.0.0.1:9000
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Generate bootstrap administrator credentials
        run: |
          admin_password="$(openssl rand -hex 32)"
          echo "::add-mask::${admin_password}"
          {
            echo "ADMIN_USERNAME=event-admin"
            echo "ADMIN_PASSWORD=${admin_password}"
          } >> "$GITHUB_ENV"

      - name: Start the services, gateway, and web interface
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Wait for the web interface
        run: >
          curl --fail --silent --show-error --output /dev/null
          --retry 30 --retry-delay 2 --retry-all-errors
          "${WEB_BASE_URL}/"

      - name: Run end-to-end tests
        shell: bash
        run: |
          set -o pipefail
          pytest -q -m e2e -rs | tee e2e-output.txt
          if grep -Eq '[0-9]+ skipped' e2e-output.txt; then
            echo "::error::End-to-end tests were skipped instead of run."
            exit 1
          fi

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v
