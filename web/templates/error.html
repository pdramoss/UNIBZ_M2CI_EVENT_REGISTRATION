{% extends "base.html" %}
{% block title %}Request error · Event Registration{% endblock %}
{% block content %}
<section class="empty-state error-state">
  <p class="eyebrow">REQUEST COULD NOT BE COMPLETED · {{ status_code }}</p>
  <h1>Something needs attention.</h1>
  <p role="alert">{{ message }}</p>
  <a class="button secondary" href="{{ url_for('index') }}">Return home</a>
</section>
{% endblock %}
